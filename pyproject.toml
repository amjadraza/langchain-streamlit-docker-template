[project]
name = "langchain-streamlit-docker-template"
version = "0.1.0"
description = "A template langchain Streamlit App with Docker"
authors = [
    {name = "Amjad Raza", email = "amjad@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.1.3",
    "langchain-openai>=1.1.2",
    "langchain-community>=0.4.1",
    "streamlit>=1.52.1",
    "pypdf>=6.4.1",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"